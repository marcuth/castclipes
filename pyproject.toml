[project]
name = "jaguar-xiv-missao"
version = "0.1.0"
description = "Funcionário virtual que gera e publica cortes de vídeos do YouTube em que MBL/Missão são citados."
authors = [
    {name = "Marcuth",email = "me@marcuth.dev"}
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "pydantic-settings>=2.6",
    "feedparser>=6.0",
    "httpx>=0.27",
    "yt-dlp>=2026.1.1",
    "youtube-transcript-api>=1.0",
    "moviepy>=2.1",
    "openai>=1.50",
    "google-api-python-client>=2.140",
    "google-auth-oauthlib>=1.2",
]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.0"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
jaguar = "jaguar_xiv_missao.cli:main"

[tool.poetry]
packages = [{include = "jaguar_xiv_missao", from = "src"}]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
